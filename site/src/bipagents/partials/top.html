<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{pagetitle}}</title>
<meta name="description" content="{{pagedesc}}">
<meta name="theme-color" content="#F7F6F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101217" media="(prefers-color-scheme: dark)">
<link rel="canonical" href="https://bipagents.com{{path}}">
{{hreflang}}
<meta property="og:type" content="website">
<meta property="og:title" content="{{pagetitle}}">
<meta property="og:description" content="{{pagedesc}}">
<meta property="og:url" content="https://bipagents.com{{path}}">
<meta property="og:image" content="https://bipagents.com/assets/og-{{lang}}.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preload" href="/assets/nunito.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="/assets/site.css?v={{version}}">
</head>
<body data-checkout="{{checkoutstate}}" data-page="{{pagename}}">
<a class="skip" href="#main">{{a11y.skip}}</a>

<header class="top" id="top">
  <a class="brand" href="{{home}}" aria-label="BipAgents">
    <span class="brand-bip" data-bip-icon aria-hidden="true"></span>
    <span class="brand-name">Bip<b>Agents</b></span>
  </a>
  <nav class="top-links" aria-label="{{a11y.nav}}">
    <a href="{{home}}#bips">{{nav.features}}</a>
    <a href="{{home}}#family">{{nav.family}}</a>
    <a href="{{home}}#private">{{nav.privacy}}</a>
    <a href="{{home}}#pricing">{{nav.pricing}}</a>
    <a href="{{demohref}}"{{cur.demo}}>{{nav.demo}}</a>
    <a href="{{faqhref}}"{{cur.faq}}>{{nav.faq}}</a>
  </nav>
  <div class="top-actions">
    <a class="top-gh" href="https://github.com/BipAgents/BipAgents" rel="noopener" aria-label="GitHub" title="GitHub"><svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg></a>
    <details class="lang">
      <summary aria-label="{{a11y.language}}">{{lang.short}}</summary>
      <div class="lang-menu">{{langmenu}}</div>
    </details>
    <a class="pill pill-ink small top-cta" href="{{betahref}}"{{cur.beta}}><span class="cta-long">{{nav.cta}}</span><span class="cta-short">{{nav.ctaShort}}</span></a>
  </div>
  <div class="progress" aria-hidden="true"><i></i></div>
</header>

<main id="main">
