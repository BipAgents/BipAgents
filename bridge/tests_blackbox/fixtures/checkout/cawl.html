<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Paiement sécurisé</title></head>
<body>
<!-- A hosted payment page written like CAWL's (Worldline Direct) on 19/11: the total above the form, « Payer » and
     « Annuler ». `?total=` changes the total shown. A hidden total and a field's value are never the page's total. -->
<header>Pharmacie de test</header>
<div class="summary"><span>Total à payer:</span> <span id="total">EUR 27.97</span></div>
<div style="display:none">Total à payer: EUR 50.00</div>
<p><label>Code promo <input id="promo" value="Remise 99,99 €" readonly></label></p>
<form onsubmit="event.preventDefault(); location.href='done.html'">
  <p><label>Numéro de carte <input id="number" autocomplete="cc-number"></label></p>
  <p><label>Nom sur la carte <input id="name" autocomplete="cc-name"></label></p>
  <p><label>Date d'expiration
    <select id="month" autocomplete="cc-exp-month"><option value="">MM</option>
      <option>01</option><option>02</option><option>03</option><option>04</option><option>05</option><option>06</option>
      <option>07</option><option>08</option><option>09</option><option>10</option><option>11</option><option>12</option>
    </select>
    <select id="year" autocomplete="cc-exp-year"><option value="">AAAA</option>
      <option>2026</option><option>2027</option><option>2028</option><option>2029</option><option>2030</option>
      <option>2031</option>
    </select></label></p>
  <p><label>Cryptogramme visuel <input id="csc" autocomplete="cc-csc"></label></p>
  <p><button type="submit">Payer</button> <button type="button" onclick="location.href='done.html?annule'">Annuler</button></p>
</form>
<script>
  const total = new URLSearchParams(location.search).get("total");
  if (total) document.getElementById("total").textContent = total;
</script>
</body></html>
